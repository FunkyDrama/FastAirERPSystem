services:
  users_db:
    image: postgres:16-alpine
    container_name: fastair_users_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB}
      POSTGRES_USER: ${USERS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD}
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  staff_db:
    image: postgres:16-alpine
    container_name: fastair_staff_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAFF_POSTGRES_DB}
      POSTGRES_USER: ${STAFF_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAFF_POSTGRES_PASSWORD}
    volumes:
      - staff_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAFF_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: fastair_redis
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fastair_rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_VM_MEMORY_LIMIT: 200Mi
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - internal
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  users:
    build:
      context: .
      dockerfile: services/users_service/Dockerfile
    container_name: fastair_users_api
    restart: unless-stopped
    depends_on:
      users_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
      - services/users_service/.env
    environment:
      - PYTHONPATH=/app
    networks:
      - internal
    command: >
      sh -c "
        alembic -c services/users_service/app/alembic.ini upgrade head &&
        uvicorn services.users_service.app.main:app --host 0.0.0.0 --port 8000 --workers 1
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  staff:
    build:
      context: .
      dockerfile: services/staff_service/Dockerfile
    container_name: fastair_staff_api
    restart: unless-stopped
    depends_on:
      staff_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
      - services/staff_service/.env
    environment:
      - PYTHONPATH=/app
    networks:
      - internal
    command: >
      sh -c "
        alembic -c services/staff_service/app/alembic.ini upgrade head &&
        uvicorn services.staff_service.app.main:app --host 0.0.0.0 --port 8000 --workers 1
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  notifications_worker_users:
    build:
      context: .
      dockerfile: notifications_service/Dockerfile
    container_name: fastair_notif_users
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
      - notifications_service/.env
    environment:
      - PYTHONPATH=/app
    networks:
      - internal
    command: celery -A notifications_service.app.worker worker --loglevel=INFO -Q users --pool=solo
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  notifications_worker_staff:
    build:
      context: .
      dockerfile: notifications_service/Dockerfile
    container_name: fastair_notif_staff
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
      - notifications_service/.env
    environment:
      - PYTHONPATH=/app
    networks:
      - internal
    command: celery -A notifications_service.app.worker worker --loglevel=INFO -Q staff --pool=solo
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  frontend-users:
    build:
      context: ./frontends/customer
      dockerfile: Dockerfile
    container_name: fastair_frontend_users
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - users
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  frontend-staff:
    build:
      context: ./frontends/staff
      dockerfile: Dockerfile
    container_name: fastair_frontend_staff
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - staff
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  seeder:
    build:
      context: .
      dockerfile: services/users_service/Dockerfile
    container_name: fastair_seeder
    working_dir: /app
    depends_on:
      users_db:
        condition: service_healthy
      staff_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
    networks:
      - internal
    command: >
      sh -c "
        SQLALCHEMY_DATABASE_URL=$${USERS_DATABASE_URL} alembic -c services/users_service/app/alembic.ini upgrade head &&
        SQLALCHEMY_DATABASE_URL=$${STAFF_DATABASE_URL} alembic -c services/staff_service/app/alembic.ini upgrade head &&
        python -m scripts.cli seed --db all --flush --flights 1000 --days 365
      "
    restart: "no"
    profiles: ["seed"]

networks:
  internal:
    driver: bridge
    name: fastair_internal

volumes:
  users_db_data:
    name: fastair_users_db
  staff_db_data:
    name: fastair_staff_db
  rabbitmq_data:
    name: fastair_rabbitmq